name: Secret leak guard
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check committed files for obvious token formats
        shell: bash
        run: |
          # Basic guardrails only; not a replacement for a dedicated secret scanner.
          if git grep -nEI '([0-9]{7,}:[A-Za-z0-9_-]{30,}|sk-(proj-)?[A-Za-z0-9_-]{30,}|ghp_[A-Za-z0-9]{30,})' -- .; then
            echo "::error::Possible API token in committed source. Remove it and rotate the affected key."
            exit 1
          else
            echo "No obvious Telegram/OpenAI/GitHub token pattern found."
          fi
